<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Influencer Tracker">
<meta name="theme-color" content="#FFFFFF">
<title>Influencer Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --m:       #800000;
  --m2:      #A00000;
  --m3:      #5A0000;
  --md:      rgba(128,0,0,0.08);
  --bg:      #FFFFFF;
  --bg2:     #FAFAFA;
  --bg3:     #F4F1F1;
  --bg4:     #EDE8E8;
  --border:  rgba(128,0,0,0.10);
  --bm:      rgba(128,0,0,0.22);
  --text:    #1A0000;
  --text2:   #6B4040;
  --text3:   #A07070;
  --green:   #187A3A;
  --red:     #C0392B;
  --amber:   #B45309;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-top: calc(62px + var(--safe-top));
  padding-bottom: calc(68px + var(--safe-bot));
  font-size: 14px;
}

/* grain */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-size:200px 200px; opacity:.25;
}

/* ── TOPBAR ── */
#topbar {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:calc(62px + var(--safe-top));
  padding-top:var(--safe-top);
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding-left:18px; padding-right:18px;
  box-shadow:0 1px 14px rgba(128,0,0,0.07);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(145deg,var(--m2),var(--m3));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(128,0,0,0.24);
}
.brand-mark svg{width:18px;height:18px;fill:#fff;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2.5px;color:var(--m);}
.home-btn{
  display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;color:var(--m);
  background:var(--md);border:1px solid var(--bm);
  border-radius:20px;padding:6px 12px;text-decoration:none;
  transition:background .15s;
}
.home-btn:active{background:rgba(128,0,0,0.14);}
.home-btn svg{width:13px;height:13px;fill:var(--m);}

/* ── BOTTOM NAV ── */
#bottom-nav {
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:calc(62px + var(--safe-bot));
  padding-bottom:var(--safe-bot);
  background:rgba(255,255,255,0.97);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  box-shadow:0 -2px 14px rgba(128,0,0,0.06);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  cursor:pointer;border:none;background:none;
  color:var(--text3);transition:color .2s;
  font-size:8px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  position:relative;
}
.nav-item svg{width:18px;height:18px;fill:currentColor;transition:transform .2s;}
.nav-item::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:2px;background:var(--m);
  transition:width .25s cubic-bezier(.4,0,.2,1);border-radius:0 0 3px 3px;
}
.nav-item.active{color:var(--m);}
.nav-item.active::after{width:24px;}
.nav-item.active svg{transform:translateY(-1px);}
.nav-item:active{opacity:.6;}

/* ── PAGES ── */
.page{display:none;flex-direction:column;gap:14px;padding:16px 14px;position:relative;z-index:1;}
.page.active{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── LOADING / ERROR ── */
#loading-screen{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:55vh;gap:20px;text-align:center;padding:40px;
}
.spinner-wrap{position:relative;width:44px;height:44px;}
.spinner-ring{
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--border);border-top-color:var(--m);
  animation:spin .8s linear infinite;position:absolute;inset:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-dot{
  width:8px;height:8px;border-radius:50%;background:var(--m);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(128,0,0,0.4);
}
.loading-title{font-size:15px;font-weight:500;color:var(--text2);}
.loading-sub{font-size:12px;color:var(--text3);font-family:'Bebas Neue',sans-serif;letter-spacing:3px;}
#error-screen{
  display:none;flex-direction:column;align-items:center;
  justify-content:center;min-height:55vh;gap:14px;text-align:center;padding:40px;
}
.error-icon{font-size:40px;}
.error-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--text);}
.error-msg{font-size:13px;color:var(--text2);max-width:260px;line-height:1.7;}
.btn-retry{
  background:linear-gradient(135deg,var(--m2),var(--m3));color:#fff;
  border:none;border-radius:10px;padding:11px 28px;
  font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.5px;margin-top:6px;
  box-shadow:0 4px 20px rgba(128,0,0,0.25);
}

/* ── SECTION LABEL ── */
.sec-label{
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;color:var(--text3);
  padding:0 2px;display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── HERO CARD ── */
.hero-card{
  background:linear-gradient(135deg,var(--m) 0%,var(--m3) 100%);
  border-radius:18px;padding:22px 20px;position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(128,0,0,0.22);
}
.hero-card::before{
  content:'';position:absolute;top:-60px;right:-40px;
  width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,255,255,0.10) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.hero-label{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.60);margin-bottom:8px;}
.hero-num{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:-1px;line-height:1;color:#fff;}
.hero-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-top:8px;font-weight:400;}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:14px 12px;}
.kpi-card.full{grid-column:1/-1;}
.kpi-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.kpi-val{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;color:var(--text);line-height:1;margin-bottom:3px;}
.kpi-val.green{color:var(--green);}
.kpi-val.red{color:var(--red);}
.kpi-val.maroon{color:var(--m);}
.kpi-sub{font-size:11px;color:var(--text3);}

/* ── INFLUENCER CARD ── */
.inf-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:14px;cursor:pointer;transition:border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.inf-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--m2),var(--m3));opacity:.7;
}
.inf-card:active{border-color:var(--bm);box-shadow:0 4px 16px rgba(128,0,0,0.10);}
.inf-card-top{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
.avatar{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--m2),var(--m3));
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;letter-spacing:1px;
  box-shadow:0 2px 10px rgba(128,0,0,0.20);
}
.inf-name-wrap{flex:1;min-width:0;}
.inf-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inf-followers{font-size:11px;color:var(--text3);margin-top:2px;}
.status-badge{
  display:inline-flex;align-items:center;
  font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;cursor:pointer;flex-shrink:0;max-width:120px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.status-badge.green-b{background:rgba(24,122,58,0.10);color:var(--green);border:1px solid rgba(24,122,58,0.20);}
.status-badge.amber-b{background:rgba(180,83,9,0.10);color:var(--amber);border:1px solid rgba(180,83,9,0.20);}
.inf-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
.inf-stat{background:var(--bg3);border-radius:8px;padding:7px 6px;text-align:center;}
.inf-stat-val{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--text);letter-spacing:.5px;}
.inf-stat-lbl{font-size:9px;color:var(--text3);font-weight:500;margin-top:2px;letter-spacing:.3px;}
.progress-bar{height:4px;background:var(--bg4);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--m2),var(--m3));border-radius:4px;transition:width .4s ease;}

/* ── DETAIL VIEW ── */
#detail-view{
  display:none;flex-direction:column;gap:14px;
  padding:16px 14px;position:relative;z-index:1;
  animation:fadeIn .25s ease;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--bm);background:var(--md);
  color:var(--m);border-radius:20px;padding:7px 14px;
  font-size:12px;font-weight:600;cursor:pointer;width:fit-content;
}
.back-btn svg{width:13px;height:13px;fill:var(--m);}
.detail-hero{
  background:linear-gradient(135deg,var(--m),var(--m3));
  border-radius:18px;padding:20px;
  box-shadow:0 8px 28px rgba(128,0,0,0.20);
  display:flex;align-items:center;gap:14px;
}
.detail-avatar{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.30);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;
}
.detail-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:#fff;line-height:1;}
.detail-meta{font-size:11px;color:rgba(255,255,255,0.55);margin-top:4px;}
.reel-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;}
.reel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.reel-num{
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;
  background:var(--md);color:var(--m3);border-radius:20px;padding:3px 10px;
}
.pay-badge{font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;}
.pay-badge.paid{background:rgba(24,122,58,0.10);color:var(--green);}
.pay-badge.pending{background:rgba(180,83,9,0.10);color:var(--amber);}
.pay-badge.unpaid{background:rgba(192,57,43,0.10);color:var(--red);}
.reel-link-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;color:var(--m);
  background:var(--md);border:1px solid var(--bm);
  border-radius:8px;padding:5px 12px;text-decoration:none;
  margin-bottom:6px;
}
.reel-views{font-size:11px;color:var(--text3);}
.info-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.info-row{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none;}
.info-lbl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);min-width:72px;padding-top:1px;}
.info-val{font-size:12px;color:var(--text2);flex:1;line-height:1.55;word-break:break-word;}
.bank-box{background:var(--bg3);border-radius:8px;padding:8px 10px;font-size:11px;font-weight:500;color:var(--text);font-family:monospace;word-break:break-all;}

/* ── PAYMENT CARDS ── */
.pay-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;}
.pay-card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pay-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.pay-chip{font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.4px;}
.pay-chip.paid{background:rgba(24,122,58,0.10);color:var(--green);}
.pay-chip.pending{background:rgba(180,83,9,0.10);color:var(--amber);}
.pay-chip.unpaid{background:rgba(192,57,43,0.10);color:var(--red);}
.pay-summary{font-size:11px;color:var(--text3);border-top:1px solid var(--border);padding-top:8px;}
.pay-summary span{font-weight:600;color:var(--text2);}

/* ── REPORT ROW ── */
.report-row{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
}
.report-info{flex:1;min-width:0;}
.report-name{font-size:13px;font-weight:700;color:var(--text);}
.report-meta{font-size:10px;color:var(--text3);margin-top:3px;}
.report-amt{text-align:right;flex-shrink:0;}
.report-total{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--m);letter-spacing:.5px;}
.report-pend{font-size:10px;color:var(--red);margin-top:2px;font-weight:600;}

/* ── STATUS POPUP ── */
#status-modal{
  position:fixed;inset:0;z-index:999;
  background:rgba(26,0,0,0.40);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:24px;
  animation:fadeIn .2s ease;
}
#status-modal.show{display:flex;}
.modal-card{
  background:var(--bg);border-radius:16px;padding:20px;
  max-width:320px;width:100%;position:relative;
  box-shadow:0 20px 60px rgba(128,0,0,0.18);
  animation:scaleIn .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--m);margin-bottom:12px;}
.modal-body{font-size:13px;color:var(--text2);line-height:1.7;}
.modal-close{
  position:absolute;top:14px;right:16px;
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--border);background:var(--bg3);
  color:var(--text2);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:calc(74px + var(--safe-bot));
  left:50%;transform:translateX(-50%);
  background:var(--m);border-radius:20px;padding:9px 18px;
  font-size:12px;font-weight:500;color:#fff;
  white-space:nowrap;z-index:998;
  box-shadow:0 4px 24px rgba(128,0,0,0.30);
  opacity:0;transition:opacity .2s;pointer-events:none;
}
#toast.show{opacity:1;}

/* ── FOOTER ── */
.page-footer{
  text-align:center;padding:10px 0 4px;
  font-size:11px;color:var(--text3);
  border-top:1px solid var(--border);margin-top:4px;
}
.page-footer a{color:var(--m);text-decoration:none;font-weight:600;}

@media(min-width:480px){body{max-width:520px;margin:0 auto;}}
svg.defs{position:absolute;width:0;height:0;overflow:hidden;}
</style>
</head>

<!-- TOPBAR -->
<div id="topbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><use href="#i-users"/></svg></div>
    <div class="brand-name">INFLUENCER</div>
  </div>
  <a href="index.html" class="home-btn">
    <svg viewBox="0 0 24 24"><use href="#i-back"/></svg>
    Home
  </a>
</div>

<!-- PAGE: DASHBOARD -->

    <div class="error-title">Data nahi mila</div>
    <div class="error-msg" id="error-msg">Sheet se connect nahi ho saka.</div>
    <button class="btn-retry" onclick="fetchSheet()">Dobara Try Karein</button>
  </div>
  <div id="dash-content" style="display:none;flex-direction:column;gap:14px;"></div>
</div>

<div id="page-roster" class="page">
  <div id="roster-content" style="display:flex;flex-direction:column;gap:12px;"></div>

<div id="detail-view"></div>

  </button>

    <svg viewBox="0 0 24 24"><use href="#i-roster"/></svg>Roster
  </button>

    <svg viewBox="0 0 24 24"><use href="#i-pay"/></svg>Payments
  </button>
  <button class="nav-item" data-page="reports" onclick="goPage('reports')">
    <svg viewBox="0 0 24 24"><use href="#i-report"/></svg>Reports
  </button>
</nav>

<!-- STATUS MODAL -->
<div id="status-modal" onclick="closeModal(event)">
  <div class="modal-card">
    <button class="modal-close" onclick="hideModal()">✕</button>
    <div class="modal-title">Collaboration Status</div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SHEET_ID   = '1S_r6TpWg6_w5rZFWGwXN95wqldjvFFGw4XZF_sKGLo4';
const SHEET_NAME = 'Sheet1';

let DATA = [];
let refreshTimer = null;
let curPage = 'dashboard';

/* ── HELPERS ── */
const fn  = n => (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toLocaleString();
const frs = n => (n===null||n===undefined||isNaN(n)) ? '—' : 'Rs. ' + Number(n).toLocaleString();
const vcell = c => {
  if (!c || c.v === null || c.v === undefined) return null;
  if (typeof c.v === 'number') return c.v;
  const s = String(c.v).trim();
  if (s === '' || s === '-') return null;
  const n = parseFloat(s.replace(/[^0-9.-]/g, ''));
  return isNaN(n) ? null : n;
};
const scell = c => {
  if (!c || c.v === null || c.v === undefined) return '';
  return String(c.f || c.v).trim();
};

/* ── CALCULATIONS ── */
function paidCount(inf) {
  let n = 0;
  if (inf.totalReels >= 1 && (inf.pay1||'').toLowerCase() === 'paid') n++;
  if (inf.totalReels >= 2 && (inf.pay2||'').toLowerCase() === 'paid') n++;
  if (inf.totalReels >= 3 && (inf.pay3||'').toLowerCase() === 'paid') n++;
  return n;
}
function paidAmt(inf) {
  if (!inf.totalAmt || !inf.totalReels) return 0;
  return Math.round((paidCount(inf) / inf.totalReels) * inf.totalAmt);
}
function pendingAmt(inf) {
  return (inf.totalAmt || 0) - paidAmt(inf);
}
function postedCount(inf) {
  let n = 0;
  if (inf.totalReels >= 1 && inf.reel1) n++;
  if (inf.totalReels >= 2 && inf.reel2) n++;
  if (inf.totalReels >= 3 && inf.reel3) n++;
  return n;
}
function totalViews(inf) {
  return (inf.views1 || 0) + (inf.views2 || 0) + (inf.views3 || 0);
}

/* ── PARSE ── */
function parseGviz(json) {
  DATA = [];
  for (const row of json.table?.rows || []) {
    const c = row.c || [];
    const name = scell(c[0]);
    if (!name) continue;
    DATA.push({
      name:        name,
      email:       scell(c[1]),
      contact:     scell(c[2]),
      followers:   scell(c[3]),
      profileLink: scell(c[4]),
      origDemand:  vcell(c[5]),
      dealPerReel: vcell(c[6]),
      totalReels:  vcell(c[7]) || 1,
      totalAmt:    vcell(c[8]),
      bankDetails: scell(c[9]),
      status:      scell(c[10]),
      notes:       scell(c[11]),
      reel1:       scell(c[12]),
      pay1:        scell(c[13]),
      views1:      vcell(c[14]) || 0,
      reel2:       scell(c[15]),
      pay2:        scell(c[16]),
      views2:      vcell(c[17]) || 0,
      reel3:       scell(c[18]),
      pay3:        scell(c[19]),
    });
  }
}

/* ── FETCH ── */
async function fetchSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}&range=A2:T500`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const m = txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!m) throw new Error('Sheet public nahi hai');
    const json = JSON.parse(m[1]);
    if (json.status === 'error') throw new Error(json.errors?.[0]?.message || 'Sheet error');
    parseGviz(json);
    if (!DATA.length) throw new Error('Sheet mein data nahi mila');
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display   = 'none';
    renderAll();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(silentRefresh, 5 * 60 * 1000);
  } catch(err) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display   = 'flex';
    document.getElementById('error-msg').textContent        = err.message;
  }
}

async function silentRefresh() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}&range=A2:T500`;
  try {
    const res = await fetch(url); if (!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/); if (!m) return;
    const json = JSON.parse(m[1]); if (json.status === 'error') return;
    parseGviz(json); if (!DATA.length) return;
    renderAll(); showToast('Data refresh ho gaya');
  } catch(e) {}
}

/* ── NAV ── */
function goPage(p) {
  // hide detail if open
  document.getElementById('detail-view').style.display = 'none';
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === p));
  curPage = p;
  window.scrollTo(0, 0);
}

/* ── STATUS MODAL ── */
function showModal(text) {
  document.getElementById('modal-body').textContent = text || '—';
  document.getElementById('status-modal').classList.add('show');
}
function hideModal() {
  document.getElementById('status-modal').classList.remove('show');
}
function closeModal(e) {
  if (e.target === document.getElementById('status-modal')) hideModal();
}

/* ── BADGE HTML ── */
function statusBadge(status, idx) {
  const isLocked = /locked|✅/i.test(status);
  const cls = isLocked ? 'green-b' : 'amber-b';
  const short = status.length > 18 ? status.slice(0, 18) + '…' : status;
  return `<span class="status-badge ${cls}" onclick="event.stopPropagation();showModal(${JSON.stringify(status)})">${short || '—'}</span>`;
}

function payBadge(status) {
  const s = (status || '').toLowerCase();
  if (s === 'paid')    return '<span class="pay-badge paid">Paid</span>';
  if (s === 'pending') return '<span class="pay-badge pending">Pending</span>';
  return '<span class="pay-badge unpaid">Unpaid</span>';
}

function payChip(label, status) {
  const s = (status || '').toLowerCase();
  const cls = s === 'paid' ? 'paid' : s === 'pending' ? 'pending' : 'unpaid';
  return `<span class="pay-chip ${cls}">${label}: ${status || 'Unpaid'}</span>`;
}

/* ── INFLUENCER CARD HTML ── */
function infCardHTML(inf, idx) {
  const views = totalViews(inf);
  const posted = postedCount(inf);
  const pct = inf.totalReels > 0 ? (posted / inf.totalReels) * 100 : 0;
  return `
  <div class="inf-card" onclick="openDetail(${idx})">
    <div class="inf-card-top">
      <div class="avatar">${inf.name.charAt(0).toUpperCase()}</div>
      <div class="inf-name-wrap">
        <div class="inf-name">${inf.name}</div>
        <div class="inf-followers">${inf.followers || '—'} followers</div>
      </div>
      ${inf.status ? statusBadge(inf.status, idx) : ''}
    </div>
    <div class="inf-stats">
      <div class="inf-stat"><div class="inf-stat-val">${fn(views)}</div><div class="inf-stat-lbl">Views</div></div>
      <div class="inf-stat"><div class="inf-stat-val">${inf.totalAmt ? 'Rs.'+Number(inf.totalAmt).toLocaleString() : '—'}</div><div class="inf-stat-lbl">Amount</div></div>
      <div class="inf-stat"><div class="inf-stat-val">${posted}/${inf.totalReels}</div><div class="inf-stat-lbl">Reels</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
}

/* ── RENDER ALL ── */
function renderAll() {
  renderDash();
  renderRoster();
  renderPayments();
  renderReports();
}

/* ── DASHBOARD ── */
function renderDash() {
  const totalReach = DATA.reduce((s, i) => s + totalViews(i), 0);
  const totalBudget = DATA.reduce((s, i) => s + (i.totalAmt || 0), 0);
  const totalPaid   = DATA.reduce((s, i) => s + paidAmt(i), 0);
  const totalPend   = DATA.reduce((s, i) => s + pendingAmt(i), 0);
  const totalPosted = DATA.reduce((s, i) => s + postedCount(i), 0);
  const totalPossible = DATA.reduce((s, i) => s + (i.totalReels || 0), 0);

  let html = `
  <div class="hero-card">
    <div class="hero-label">Total Reach</div>
    <div class="hero-num">${fn(totalReach)}</div>
    <div class="hero-sub">${DATA.length} influencers · ${totalPosted}/${totalPossible} reels posted</div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-lbl">Total Budget</div>
      <div class="kpi-val maroon">${frs(totalBudget)}</div>
      <div class="kpi-sub">campaign total</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-lbl">Paid</div>
      <div class="kpi-val green">${frs(totalPaid)}</div>
      <div class="kpi-sub">disbursed</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-lbl">Pending</div>
      <div class="kpi-val red">${frs(totalPend)}</div>
      <div class="kpi-sub">remaining</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-lbl">Total Views</div>
      <div class="kpi-val maroon">${fn(totalReach)}</div>
      <div class="kpi-sub">across all reels</div>
    </div>
  </div>

  <div class="sec-label">Recent</div>`;

  DATA.slice(0, 5).forEach((inf, i) => { html += infCardHTML(inf, i); });
  html += `<div class="page-footer">Developed by <a href="https://www.linkedin.com/in/usmankhan07/" target="_blank" rel="noopener">Usman Khan</a></div>`;

  const c = document.getElementById('dash-content');
  c.innerHTML = html; c.style.display = 'flex';
}

/* ── ROSTER ── */
function renderRoster() {
  let html = `<div class="sec-label">Tamam Influencers</div>`;
  DATA.forEach((inf, i) => { html += infCardHTML(inf, i); });
  html += `<div class="page-footer">Developed by <a href="https://www.linkedin.com/in/usmankhan07/" target="_blank" rel="noopener">Usman Khan</a></div>`;
  document.getElementById('roster-content').innerHTML = html;
}

/* ── DETAIL VIEW ── */
function openDetail(idx) {
  const inf = DATA[idx];
  if (!inf) return;
  const views = totalViews(inf);
  const posted = postedCount(inf);
  const paid   = paidAmt(inf);
  const pend   = pendingAmt(inf);

  let reelsHTML = '';
  const reelData = [
    { num:1, link:inf.reel1, pay:inf.pay1, views:inf.views1 },
    { num:2, link:inf.reel2, pay:inf.pay2, views:inf.views2 },
    { num:3, link:inf.reel3, pay:inf.pay3, views:null },
  ];
  for (let r = 0; r < inf.totalReels; r++) {
    const rd = reelData[r];
    reelsHTML += `
    <div class="reel-card">
      <div class="reel-head">
        <span class="reel-num">REEL ${rd.num}</span>
        ${payBadge(rd.pay)}
      </div>
      ${rd.link
        ? `<a href="${rd.link}" target="_blank" rel="noopener" class="reel-link-btn"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--m)"><use href="#i-link"/></svg>Link Kholein</a>`
        : `<div style="font-size:12px;color:var(--text3);font-style:italic;margin-bottom:6px;">Link nahi diya</div>`
      }
      ${rd.views !== null ? `<div class="reel-views">${fn(rd.views)} views</div>` : ''}
    </div>`;
  }

  const shortStatus = inf.status.length > 18 ? inf.status.slice(0,18) + '…' : inf.status;

  const html = `
  <button class="back-btn" onclick="closeDetail()">
    <svg viewBox="0 0 24 24"><use href="#i-back"/></svg> Back
  </button>
  <div class="detail-hero">
    <div class="detail-avatar">${inf.name.charAt(0).toUpperCase()}</div>
    <div>
      <div class="detail-name">${inf.name}</div>
      <div class="detail-meta">${inf.followers || '—'} followers · ${inf.totalReels} reel${inf.totalReels>1?'s':''}</div>
    </div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-lbl">Total Views</div><div class="kpi-val maroon">${fn(views)}</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Paid</div><div class="kpi-val green">${frs(paid)}</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Pending</div><div class="kpi-val red">${frs(pend)}</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Reels Posted</div><div class="kpi-val maroon">${posted}/${inf.totalReels}</div></div>
  </div>
  <div class="sec-label">Reels</div>
  ${reelsHTML}
  <div class="sec-label">Info</div>
  <div class="info-card">
    ${inf.email    ? `<div class="info-row"><span class="info-lbl">Email</span><span class="info-val">${inf.email}</span></div>` : ''}
    ${inf.contact  ? `<div class="info-row"><span class="info-lbl">Contact</span><span class="info-val">${inf.contact}</span></div>` : ''}
    ${inf.status   ? `<div class="info-row"><span class="info-lbl">Status</span><span class="info-val"><span class="status-badge ${/locked|✅/i.test(inf.status)?'green-b':'amber-b'}" style="cursor:pointer" onclick="showModal(${JSON.stringify(inf.status)})">${shortStatus||'—'}</span></span></div>` : ''}
    ${inf.notes    ? `<div class="info-row"><span class="info-lbl">Notes</span><span class="info-val">${inf.notes}</span></div>` : ''}
    ${inf.bankDetails ? `<div class="info-row"><span class="info-lbl">Bank</span><span class="info-val"><div class="bank-box">${inf.bankDetails}</div></span></div>` : ''}
  </div>
  <div class="page-footer">Developed by <a href="https://www.linkedin.com/in/usmankhan07/" target="_blank" rel="noopener">Usman Khan</a></div>`;

  const dv = document.getElementById('detail-view');
  dv.innerHTML = html;
  dv.style.display = 'flex';
  // Hide roster page, keep nav visible
  document.getElementById('page-roster').classList.remove('active');
  window.scrollTo(0, 0);
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('page-roster').classList.add('active');
  window.scrollTo(0, 0);
}

/* ── PAYMENTS ── */
function renderPayments() {
  const totalBudget = DATA.reduce((s, i) => s + (i.totalAmt || 0), 0);
  const totalPaid   = DATA.reduce((s, i) => s + paidAmt(i), 0);
  const totalPend   = DATA.reduce((s, i) => s + pendingAmt(i), 0);

  let html = `
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-lbl">Total Budget</div><div class="kpi-val maroon">${frs(totalBudget)}</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Paid</div><div class="kpi-val green">${frs(totalPaid)}</div></div>
    <div class="kpi-card full"><div class="kpi-lbl">Remaining</div><div class="kpi-val red">${frs(totalPend)}</div></div>
  </div>
  <div class="sec-label">Per Influencer</div>`;

  DATA.forEach(inf => {
    const paid = paidAmt(inf);
    const pend = pendingAmt(inf);
    const chips = [];
    if (inf.totalReels >= 1) chips.push(payChip('Reel 1', inf.pay1));
    if (inf.totalReels >= 2) chips.push(payChip('Reel 2', inf.pay2));
    if (inf.totalReels >= 3) chips.push(payChip('Reel 3', inf.pay3));

    html += `
    <div class="pay-card">
      <div class="pay-card-top">
        <div class="avatar" style="width:34px;height:34px;font-size:14px;">${inf.name.charAt(0).toUpperCase()}</div>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--text);">${inf.name}</div>
          ${inf.contact ? `<div style="font-size:11px;color:var(--text3);">${inf.contact}</div>` : ''}
        </div>
      </div>
      <div class="pay-chips">${chips.join('')}</div>
      <div class="pay-summary">Paid: <span>${frs(paid)}</span> &nbsp;·&nbsp; Pending: <span style="color:var(--red);">${frs(pend)}</span></div>
    </div>`;
  });

  html += `<div class="page-footer">Developed by <a href="https://www.linkedin.com/in/usmankhan07/" target="_blank" rel="noopener">Usman Khan</a></div>`;
  document.getElementById('payments-content').innerHTML = html;
}

/* ── REPORTS ── */
function renderReports() {
  const totalReach  = DATA.reduce((s, i) => s + totalViews(i), 0);
  const totalBudget = DATA.reduce((s, i) => s + (i.totalAmt || 0), 0);
  const totalPaid   = DATA.reduce((s, i) => s + paidAmt(i), 0);
  const totalPend   = DATA.reduce((s, i) => s + pendingAmt(i), 0);
  const totalPosted = DATA.reduce((s, i) => s + postedCount(i), 0);
  const totalPossible = DATA.reduce((s, i) => s + (i.totalReels || 0), 0);

  let html = `
  <div class="hero-card">
    <div class="hero-label">Campaign Summary</div>
    <div class="hero-num">${fn(totalReach)}</div>
    <div class="hero-sub">${DATA.length} influencers · ${totalPosted}/${totalPossible} reels · ${frs(totalBudget)} budget</div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-lbl">Paid</div><div class="kpi-val green">${frs(totalPaid)}</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Pending</div><div class="kpi-val red">${frs(totalPend)}</div></div>
  </div>
  <div class="sec-label">Influencer Breakdown</div>`;

  DATA.forEach(inf => {
    const pend = pendingAmt(inf);
    const posted = postedCount(inf);
    html += `
    <div class="report-row">
      <div class="avatar" style="width:36px;height:36px;font-size:15px;flex-shrink:0;">${inf.name.charAt(0).toUpperCase()}</div>
      <div class="report-info">
        <div class="report-name">${inf.name}</div>
        <div class="report-meta">${inf.followers||'—'} followers · ${posted}/${inf.totalReels} reels · ${fn(totalViews(inf))} views</div>
      </div>
      <div class="report-amt">
        <div class="report-total">${inf.totalAmt ? 'Rs.'+Number(inf.totalAmt).toLocaleString() : '—'}</div>
        ${pend > 0 ? `<div class="report-pend">-Rs.${pend.toLocaleString()} pending</div>` : ''}
      </div>
    </div>`;
  });

  html += `<div class="page-footer">Developed by <a href="https://www.linkedin.com/in/usmankhan07/" target="_blank" rel="noopener">Usman Khan</a></div>`;
  document.getElementById('reports-content').innerHTML = html;
}

/* ── TOAST ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ── INIT ── */
window.addEventListener('load', fetchSheet);
</script>
